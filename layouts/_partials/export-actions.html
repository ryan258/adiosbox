<div class="result-actions" data-export-scope="{{ .scope }}" role="group" aria-label="Export {{ .label }}">
  <button class="text-button" type="button" data-export-format="html">Export {{ .label }} as HTML</button>
  <button class="text-button" type="button" data-export-format="md">Export {{ .label }} as Markdown</button>
  <span class="status" data-export-status role="status"></span>
</div>
