slug: constraint-switch
order: 100
title: Constraint switch
description: Strip a workflow down to what it must accomplish, then rebuild it for a constraint its current design assumes away.
inputLabel: Current workflow and the constraint to change
placeholder: Describe the steps you take now and name one condition that will change…
instructions: >-
  Map the current workflow into outcomes, dependencies, and implementation
  choices. For every essential outcome, state how a person would tell it was
  achieved. Identify exactly which implementation choices the new constraint
  invalidates. Separate any assumptions from facts. Do not redesign it yet.
  Use plain text, up to 180 words.
sampleNotes: >-
  I prepare a weekly project update in one uninterrupted 45-minute session.
  I reread notes, choose one decision and one open question, edit the update
  to 150 words, and save it for a human to review. New constraint: I have
  three five-minute slots and can dictate, but typing is difficult.
stageOne: Find what must survive
sampleResult: |-
  Essential outcomes
  • One decision and one open question are recoverable from the update.
  • The draft fits 150 words and has a saved location for human review.

  Current dependencies
  • Project notes contain or point to the decision and question.
  • The author can reread, edit, and save in one uninterrupted sitting.

  Choices the constraint invalidates
  • Reviewing all notes at once.
  • Relying on detailed keyboard editing to compress the draft.
chain:
  title: Rebuild the workflow
  instructions: >-
    The user message is JSON containing originalInput and stepOne. Rebuild
    the workflow to fit the new constraint. Preserve each essential outcome
    from the map unless it conflicts with the original. Give the shortest
    sequence of actions, state what is saved after each interruptible unit,
    and name one observable acceptance check. Mark any required tool
    capability as an assumption. Plain text, up to 250 words.
  sampleResult: |-
    Slot 1 · Dictate the decision and question into the draft. Save with the project name and week.
    Slot 2 · Ask for a 150-word version using only those two items and the linked notes. Save it in the same draft.
    Slot 3 · Listen to the draft. Say “keep” or dictate one correction. Save the draft for human review.

    Acceptance check: the saved draft names one decision and one open question, fits 150 words, and has a review location.
    Assumption: the draft editor supports dictation and read-aloud.
