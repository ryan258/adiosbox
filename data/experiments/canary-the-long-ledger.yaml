slug: canary-the-long-ledger
order: 421
shelf: canaries
title: "Canary: the long ledger"
description: "Track a long register of sales, refunds, voids, and corrections with no calculator. One slip anywhere changes the total."
inputLabel: A register log, one entry per line
placeholder: "T01 sale 12.50, T02 refund T01, T03 void T02, T04 correct T01 to 9.00…"
lab:
  mode: prompt
  technique: canary
  answerKind: cents
  runLabel: Run the canary
  help: "Three fresh calls with the same model and prompt. The canary trips only when all three totals match the key to the cent. Long exact state tracking is what agent bookkeeping assumes."
  roles:
    - key: comparison
      label: Model used for all three attempts
  fields:
    - key: expected
      label: Correct total (two decimals)
  prompt: >-
    The user message is a register log, one entry per line. A sale entry
    opens a sale with its amount. "refund Txx" closes that sale. "void Txx"
    cancels that refund and reopens its sale. "correct Txx to A" changes that
    open sale's amount to A. Replay every entry in order and add up the
    amounts of the sales that are open at the end. Work it out carefully
    without skipping entries. Respond with JSON only, in the form
    {"answer": "1234.56"}, using two decimals and no currency sign.
