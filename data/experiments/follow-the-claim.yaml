slug: follow-the-claim
order: 270
shelf: check
title: Follow the claim
description: "Carry sources and exact quotes through a rewrite. See which evidence made it and which claims drifted."
inputLabel: Source excerpts, each beginning with a label such as [A]
placeholder: Paste labeled source excerpts, one source block after another…
sampleNotes: |-
  [A] The repair pilot served 18 riders in April.
  [B] Eleven riders filled in the feedback form. Eight marked the session useful.
  [C] The organizer proposed a second pilot for June.
lab:
  mode: evidence
  help: "Two calls: one pulls out the claims, one rewrites them. Then code checks that each quote really sits in the excerpt it names and came from the first pass. Whether a quote actually supports its claim is your call."
  runLabel: Trace claims
  roles:
    - { key: extract, label: Extract claims }
    - { key: rewrite, label: Write the summary }
  graphSpec:
    mode: evidence
    nodes:
      extract:
        title: Extract an evidence ledger
        prompt: >-
          Extract up to four factual claims from labeled source blocks. Return JSON only
          in the format {"claims":[{"claim":"statement","source":"A","quote":"exact source text"}]}.
          Copy continuous quotations verbatim from the matching block and omit unsupported claims.
      rewrite:
        title: Rewrite from the ledger
        prompt: >-
          The user JSON contains originalInput and ledger. Write up to four
          concise public-facing sentences. Return JSON only as
          {"claims":[{"claim":"sentence","source":"A","quote":"exact source text"}]}.
          Carry forward exact citations from the ledger when possible. Preserve counts,
          denominators, and the distinction between plans and completed events.
  samples:
    - title: Exact quote carried through
      text: The April pilot served 18 riders. [A] “The repair pilot served 18 riders in April.”
    - title: Quote missing from the named source
      text: A June event was approved. [C] “A second pilot was approved for June.” The supplied source describes a proposal.
