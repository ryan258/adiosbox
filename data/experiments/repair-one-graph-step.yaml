  samples:
    - title: Original merge
      text: Count calls that went to voicemail and whether those people booked.
    - title: Repair one finding
      text: The voicemail log only covers staffed hours. People who cannot call then remain invisible.
    - title: Revised merge
      text: Count missed bookings among recorded callers. To learn about people outside the booking window, trial an after-hours callback form and tally those requests separately.
