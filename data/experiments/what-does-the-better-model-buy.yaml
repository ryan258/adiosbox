slug: what-does-the-better-model-buy
order: 300
shelf: trial
title: What does the better model buy?
description: "Swap only the reviewer model. Compare what it caught, how long it took, and what OpenRouter reported."
inputLabel: Idea and how you want a learner to explain it back
placeholder: Supply a teaching task with at least one concrete distinction to check…
sampleNotes: >-
  Explain for a 10-year-old why a map app's arrival estimate can increase as
  they get closer. They should explain what matters besides distance and
  correctly apply it to another example.
lab:
  mode: cost
  graph: teachback-loop
  help: "Pick two different reviewer models. Both review the same first draft, and each can send it back once to the same writer. Up to seven calls in all. Timing and usage describe this run only."
  runLabel: Compare reviewers
  roles:
    - { key: writer, label: Shared writer }
    - { key: baseline, label: Baseline reviewer }
    - { key: challenger, label: Challenger reviewer }
  samples:
    - title: Written baseline review
      text: Accept. The draft gives an example of roadwork causing a later arrival.
    - title: Written challenger review
      text: Revise. The draft gives the explanation, then asks the learner to repeat it. Add a new scenario in which the distance changes and traffic clears.
