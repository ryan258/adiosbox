slug: examples-to-acceptance-tests
order: 130
title: Examples to acceptance tests
description: Infer the rules hiding inside a few examples, then generate tests that expose what still needs a decision.
inputLabel: Examples with observed or expected outcomes
placeholder: Paste a few cases, including what happened or should happen in each…
instructions: >-
  Extract candidate rules from the supplied examples. For each rule, cite
  the example that supports it and distinguish stated requirements from
  guesses based on a pattern. Flag conflicting outcomes and one boundary
  that none of the examples settles. Use short example labels or make labels
  from their order. Plain text, under 180 words.
sampleNotes: |-
  A · A member cancels exactly 24 hours before a class: full credit.
  B · A member cancels 3 hours before: no credit.
  C · The instructor cancels 2 hours before: full credit.
  D · A member cancels 25 hours before a sold-out class: full credit.
stageOne: Infer the rules
sampleResult: |-
  • Member cancellation at or above 24 hours appears eligible. A and D support that reading.
  • Member cancellation at 3 hours is ineligible in B. The examples do not establish what happens just under 24 hours.
  • Instructor cancellation earns full credit at 2 hours in C. A universal instructor exception is plausible but still inferred.
  • D does not establish whether sold-out status matters because it already meets the apparent time threshold.
chain:
  title: Turn uncertainty into tests
  instructions: >-
    The user message is JSON containing originalInput and stepOne. Write
    four concise acceptance cases, with Given, When, and Then. Include an
    exact known boundary, a near-boundary case, a precedence case, and one
    missing or conflicting fact. Label outcomes confirmed only if supplied
    examples settle them. For unsettled outcomes write “Needs decision” and
    state the choice the owner must make. Plain text, up to 250 words.
  sampleResult: |-
    • Given a member booking, when the member cancels exactly 24 hours before the class, then grant full credit. Confirmed by A.
    • Given a member booking, when the member cancels 23 hours and 59 minutes before class, then needs decision. Is 24 hours a hard threshold?
    • Given an active booking, when the instructor cancels 2 hours before class, then grant full credit. Confirmed by C.
    • Given a sold-out class, when a member cancels 3 hours before and a waitlisted member takes the slot, then needs decision. Does filling a seat override the apparent late-cancellation rule?
