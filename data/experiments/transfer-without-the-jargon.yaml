slug: transfer-without-the-jargon
order: 140
title: Transfer without the jargon
description: Isolate the mechanism behind a technique, then try it in another domain and name where the analogy fails.
inputLabel: Source technique and target situation
placeholder: Explain an idea from one setting and what you want to change in another…
instructions: >-
  Describe the source technique as a causal mechanism. Name what is changed,
  the immediate effect, the desired downstream effect, and the conditions
  it depends on. Separate observed facts from guesses. Remove domain
  vocabulary where a plain term works. Do not propose the transfer yet.
  Plain text, under 160 words.
sampleNotes: >-
  In a busy kitchen, cooks put the tools and measured ingredients in reach
  before orders start. That lets them cook without repeatedly searching or
  measuring under pressure. I want to apply that idea to reviewing three
  draft audio interviews after work.
stageOne: Extract the mechanism
sampleResult: |-
  Move predictable setup decisions before the busy period. With inputs ready and in reach, the person spends less attention switching between preparation and execution.
  Conditions: Most inputs can be identified early, setup stays useful until the work starts, and selecting one set of inputs does not prevent necessary changes later.
chain:
  title: Try the transfer
  instructions: >-
    The user message is JSON containing originalInput and stepOne. Design
    a small transfer experiment in the target situation. Map two specific
    source actions to target actions, name one source assumption that fails
    in the target, and state how the trial will preserve flexibility. End with
    one observation that would count against the transfer being useful.
    Use plain text, up to 240 words.
  sampleResult: |-
    • Putting tools in reach becomes making one folder with the three audio files, headphones, and the editor already open.
    • Measuring ingredients becomes preparing a short review checklist and a place to record timestamped notes before listening.
    • Unlike ingredients, some questions emerge only after hearing a surprising answer. Leave a blank note section for discoveries.

    Trial: prepare for one interview this way. If setup takes longer than the time you save finding files or recalling the criteria, simplify or drop the routine.
