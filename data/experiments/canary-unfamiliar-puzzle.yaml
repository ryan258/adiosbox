slug: canary-unfamiliar-puzzle
order: 420
shelf: canaries
title: "Canary: the unfamiliar puzzle"
description: "Famous puzzles with one rule changed. A model that recalls the textbook answer misses. One that actually searches gets it right."
inputLabel: A puzzle with one rule changed from the version everyone knows
placeholder: Describe the puzzle, every rule, and exactly what to count…
lab:
  mode: prompt
  technique: canary
  answerKind: number
  runLabel: Run the canary
  help: "Three fresh calls with the same model and prompt. The canary trips only when all three match the key. A search program computed each key."
  roles:
    - key: comparison
      label: Model used for all three attempts
  fields:
    - key: expected
      label: Correct number
  prompt: >-
    Solve the puzzle in the user message exactly as stated. The rules may
    differ from a version you know, so do not rely on a remembered answer.
    Find the true minimum. Respond with JSON only, in the form
    {"answer": "<number>"}.
  cases:
    - id: bridge-feud
      title: The bridge with a feud
      input: >-
        Four volunteers must cross a narrow bridge at night with one lantern.
        At most two people cross at a time, someone must carry the lantern on
        every crossing, and a pair moves at the slower person's pace. Alone,
        they take 1, 2, 5, and 8 minutes. The 1-minute and 2-minute volunteers
        refuse to cross together. What is the minimum total time, in minutes,
        to get all four across?
      fields:
        expected: "24"
    - id: bridge-five
      title: Five on the bridge
      input: >-
        Five people must cross a bridge at night with one lantern. At most two
        cross at a time, the lantern must go with every crossing, and a pair
        moves at the slower person's pace. Alone, they take 1, 3, 4, 6, and 9
        minutes. The 1-minute and 9-minute people refuse to cross together.
        What is the minimum total time, in minutes, to get all five across?
      fields:
        expected: "24"
    - id: three-jugs
      title: Three jugs
      input: >-
        You have three empty jugs that hold 4, 9, and 14 liters, and a tap.
        One step is one of these actions: fill a jug from the tap, empty a jug
        onto the ground, or pour from one jug into another until the first is
        empty or the second is full. What is the minimum number of steps until
        some jug holds exactly 11 liters?
      fields:
        expected: "7"
  samples:
    - title: What a trip looks like
      text: All three attempts answer 24 for the bridge with a feud. Canary verdict · Tripped. 3 of 3 attempts matched the answer key.
    - title: What a miss looks like
      text: An attempt answers 15. That is the famous answer for 1, 2, 5, and 8, and it depends on the two fastest crossing together. Canary verdict · Not yet.
