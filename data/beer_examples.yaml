competing-explanations:
  title: Why did the pale ale sell out?
  input: >-
    Our taproom sold 48 pale ales this Thursday, up from 30 last Thursday. We moved the pale ale to the first line of the board, lowered its price by a dollar, and had a local trivia team book three tables. The room was otherwise about as busy. The brewer credits the new board position.
  result: >-
    Board position may have made the beer easier to notice. The discount or the trivia booking could explain part of the jump as well. Keep the price fixed next Thursday, rotate the first two listings halfway through, and count orders for both in each block. Record the trivia bookings so you can see whether a group changed the mix.
evidence-audit:
  title: Did the tasting tray double signups?
  input: |-
    Claim: Our alcohol-free tasting tray doubled newsletter signup rates.
    [A] March: 12 signups among 60 eligible visitors. April: 24 signups among 120 eligible visitors.
    [B] Staff began offering the tray in April. The April event also had a second entrance.
  result: >-
    Supported — Signup totals doubled from 12 to 24 [A].
    Both signup rates were 20%, so the claimed rate change is unsupported.
    Publish: “Newsletter signups rose from 12 to 24 as eligible attendance doubled. We introduced the alcohol-free tray in April.”
break-the-metric:
  title: A flight count that can go wrong
  input: >-
    We want first-time guests to find a beer style they enjoy without feeling pressured. The taproom proposes counting flights sold and using that number to rank shifts. Staff can split one guided tasting into two smaller flights.
  result: >-
    An easy way to raise the score is to split each tasting, even when the guest gets no extra help. Keep flight sales as context. Sample one question at the end of a visit: “Could you name a style you’d order again, including alcohol-free options?”
rough-notes:
  title: Saturday’s bottle swap
  input: >-
    Bottle swap Saturday. The patio might be wet. Kim can bring two folding tables if I ask by Thursday. We have only 12 empty label cards. I need to decide which door everyone uses. The café next door said we could borrow a marker.
  result: >-
    Next action · Ask Kim today to confirm both tables. By Friday, count expected bottles and make extra label cards if needed. On Saturday morning, choose the dry entrance and tell guests which door to use.
prompt-control-group:
  title: Who’s printing the beer cards?
  input: >-
    Imani said, “I’ll update the beer descriptions by Friday.” Jo asked if the tasting cards should be printed Saturday. Everyone agreed that would help. The manager said the cask arrives at noon. Nobody took the printing job.
  result: >-
    Arm A might list “Print tasting cards Saturday” as an action. Arm B can keep “Imani will update descriptions by Friday” as an assigned action and put printing under open follow-up. Inspect whether either arm assigns responsibility the meeting never assigned.
rubric-reversal:
  title: Pick a place for the tasting
  input: |-
    Option A is a taproom next to a bus stop. It has step-free access and a loud public room.
    Option B is a quiet community hall with step-free access, an accessible restroom, and a 12-minute walk from transit.
    Both are within budget. We expect 18 guests, including people who rely on transit and people who have trouble hearing through crowd noise.
  result: >-
    If easy arrival leads, pick A and verify a quiet table before booking. If being able to hear the guided tasting leads, pick B and arrange a meeting point near transit. The deciding evidence is whether A can offer a quiet room for all 18 guests.
handoff-fire-drill:
  title: Two chalkboard files
  input: >-
    The updated beer board is in Drive and Avery approved the stout description. There are two files called “Friday Board.” The keg swap time is in the bar chat somewhere. Whoever opens should put up the new board and make sure the alcohol-free line is right.
  result: >-
    The opener cannot tell which “Friday Board” to print. Add the approved file link and the confirmed keg swap time. Until those are known, the safe first action is to verify the correct file with Avery and leave the current board up.
rule-under-pressure:
  title: One souvenir glass per guest
  input: >-
    Draft rule: one souvenir glass per guest at the lager release until all 100 are gone. The purpose is to keep a few groups from taking the whole supply. In an ordinary case, Alex picks up one glass in person. A guest who uses a wheelchair asks a friend to collect it while the entrance is crowded.
  result: >-
    A one-per-transaction reading wrongly blocks someone getting help. Count one glass per eligible guest. Allow an authorized friend to collect when staff can check and mark the guest’s ticket once. The same check prevents double collection.
pre-mortem-tripwires:
  title: A tiny cask night
  input: >-
    We’re trying a cask night in three weeks. The room seats 24. We expect 16 reservations and up to 10 walk-ins. One person takes orders and answers questions. We have one hour a week to monitor preparations. A second cask is listed as tentative.
  result: >-
    If reservations reach 20, cap walk-ins so the room can stay within 24 seats. If the second cask is still unconfirmed two days before, revise the listing to one cask and tell booked guests. If the queue reaches six people, pause the guided pours until it clears.
constraint-switch:
  title: Update a beer board in short bursts
  input: >-
    I usually update the tap board in one 30-minute block: check sold-out kegs, name the replacement, edit the board, and send the photo for review. This week I have three five-minute slots, can dictate, and may lose the third slot. The old board can stay up if we mark unavailable beers clearly.
  result: >-
    Step 1 · The one-session workflow hides a dependency: marking sold-out beer can happen before any replacement is confirmed.
    Step 2 · Slot 1 records the sold-out lines and saves a photo. Slot 2 marks those beers unavailable and dictates the replacement draft. Slot 3 sends the reviewed board if the keg is confirmed. If the third slot disappears, the sold-out labels still protect guests.
disagreement-compiler:
  title: A tasting menu for regulars or newcomers
  input: |-
    Cam: Lead with the rotating cask. Regulars come back to find something different, and it is only here this weekend.
    Ren: Put the house lager first. First-time guests ask for a starting point, and they can still discover the cask underneath.
  result: >-
    Both want people to find a beer worth ordering. Cam wants returning guests to notice what’s new. Ren wants to shorten the first decision for someone who has never been. Test a board with “Start here” beside the lager and “This weekend” beside the cask. Count recommendation requests as well as orders.
undo-plan:
  title: Retire the chalkboard carefully
  input: >-
    Replace the taproom’s handwritten chalkboard with a display that staff update from a tablet. The opening shift needs to mark a beer sold out in under two minutes. The Wi-Fi sometimes drops and one opener has no tablet access. We need to preserve the visible beer name, price, and alcohol-free choices.
  result: >-
    Keep a dated chalkboard photo and a clean physical board through the trial. If the display or tablet access fails during service, put up the physical board with sold-out lines marked, then compare it with the draft digital list before switching back.
examples-to-acceptance-tests:
  title: A returnable bottle deposit
  input: |-
    A · Bottle B17 has an unused $2 deposit token. A guest returns B17 and the token: refund $2 and mark the token used.
    B · B17 arrives with a used token: show the date it was used and leave the refund total unchanged.
    C · The guest disputes the previous return: record the bottle and token IDs and ask the shift lead to review.
  result: >-
    Given B17 and an unused matching token, when staff accept the return, then the register shows a $2 refund and marks the token used once. Given that token is used, when it is presented again, then the register shows the prior use date and creates no refund.
transfer-without-the-jargon:
  title: A cellar checklist for photo backup
  input: >-
    Our cellar shift labels each keg with the beer, tap number, and status before opening. Staff can see what is connected, what is ready, and what waits for inspection. Apply that idea to sorting phone photos after a brewery tour. I want to know what’s backed up before deleting anything from the phone.
  result: >-
    Mark batches “on phone,” “copied,” and “opened from backup.” Keep the phone copies until you can open one photo from each copied batch at the destination. A label on a batch is no proof it copied intact.
practice-the-interruption:
  title: Pitch an alcohol-free flight
  input: >-
    To the taproom committee: “I want a permanent alcohol-free flight with three rotating styles. We can use the same small glasses and let guests order singles. I’d like a yes or no today.” The manager will probably interrupt about cooler space.
  result: >-
    Manager: Which stock comes out of the cooler?
    Speaker: The proposal needs one shelf, so I’ll start with the current single-serve shelf and cap the pilot at three styles.
    Bridge back: The decision today is whether to try it for four weekends and see how often guests order it.
salvage-and-recombine:
  title: Rebuild a brewery-tour welcome sheet
  input: |-
    Goal: Make a one-page brewery-tour welcome sheet.
    [A] Old flyer says meet by the loading doors at 2 p.m. Team chat says the safe meeting place is now the front desk.
    [B] Current note says 12 people per group; alcohol-free samples available. No confirmed tour time.
    [C] Guide’s draft explains where ear protection is offered, at the front desk.
  result: >-
    Welcome · Check in at the front desk for ear protection and an alcohol-free sample option [B, C]. Groups are limited to 12 [B]. Tour time · Pending confirmation. Leave the old loading-door directions out and verify the front-desk wording before printing [A, C].
claim-release-gate:
  title: A safer claim about the shorter queue
  input: |-
    Claim: Our new beer-flight board cut the average wait in half.
    [A] Two Friday spot checks: 16 minutes at 19:00 before the change, 8 minutes at 19:00 after it.
    [B] We had one extra server on the second Friday. No other times were recorded.
  result: >-
    Narrow the claim. “At 7 p.m., the observed wait was 8 minutes on the second Friday, down from 16 minutes on the first.” Two snapshots with different staffing support that comparison. They can’t establish an average or isolate the board’s effect.
the-one-question-gate:
  title: Where do bottle-share guests check in?
  input: >-
    Write a short note for Saturday’s bottle share. Check-in will be at either the front bar or the patio gate. The manager hasn’t made that choice. Guests need to know where to go first, and both entrances are open.
  result: >-
    Which entrance did the manager choose for bottle-share check-in, the front bar or the patio gate? That answer determines the first direction in the guest note.
teachback-loop:
  title: Same number of kegs, different capacity
  input: >-
    Explain to a new taproom volunteer why two kegs can hold different total amounts even though each order lists “one keg.” Use a 20-liter and a 30-liter keg. They should calculate a fresh comparison and explain why counting the containers alone can mislead.
  result: >-
    A 20-liter keg plus a 30-liter keg holds 50 liters. Two 20-liter kegs hold 40. Both orders have two kegs. Teachback question: Which holds more, one 30-liter keg or two 20-liter kegs, and how can you tell?
minutes-have-to-add-up:
  title: Twenty minutes before opening
  minutes: 20
  input: >-
    Before the taproom opens I need 8 minutes to update the sold-out beer line, 7 minutes to put out the alcohol-free menu cards, and 12 minutes to alphabetize the spare labels. The first two are needed at opening. Spare labels can wait.
  result: >-
    8 min · Mark the sold-out line. 7 min · Put out the alcohol-free cards. Hold the 12-minute label task until later. Total scheduled is 15 of 20 minutes, with 5 unallocated.
the-invisible-queue:
  title: The tasting queue that never gets counted
  input: >-
    The brewery tracks checked-in guests and completed tastings. Walk-ins scan a QR code outside for the waitlist, but there is no signal near the entrance. People can also text a number listed only at the counter. Staff report that 96% of checked-in groups get seats.
  result: >-
    Outside the queue · A person turns away before a checked-in booking exists. Inside the queue · A group gets a text but leaves after waiting. Trial a paper tally for arrivals who can’t get onto the list. Keep it separate from completion among checked-in groups.
the-regression-you-would-miss:
  title: A filterable beer list hides the short list
  input: >-
    Replace the printed beer menu with a searchable phone menu. The old menu always puts three alcohol-free choices on the front. The proposed filter lives under “More.” Staff often point to the printed section rather than read out all the options.
  result: >-
    A guest should be able to find all three alcohol-free choices from the first menu screen without knowing the category label. Test that with a first-time guest and keep a readable printed menu for people who don’t use a phone.
choose-what-to-protect:
  title: New tasters versus returning guests
  input: >-
    We have 16 seats for one tasting on Sunday. Ten returning guests want the follow-up session and 14 first-timers are still waiting. We can staff only one session. The two groups need different starting material.
  result: >-
    If you choose to protect access for first-timers, hold 12 seats for them and use the remaining four for a returning-guest waitlist. If you choose continuity, reserve ten follow-up seats instead. Publish which goal the allocation serves before opening the list.
release-or-rehearse:
  title: Rehearse the new flight board
  input: >-
    We’re replacing the tasting-flight chalkboard with numbered table cards on Friday. The brewer tried one card at a quiet table. Nobody tested whether guests can find the alcohol-free choices or tell which number belongs to a sold-out beer during a busy shift.
  result: >-
    Rehearse with one table and a mock sold-out beer. Ask a first-time guest to point out the available alcohol-free choices and the sold-out number without coaching. If they cannot, change the card or keep the old board for Friday.
shapeshifting-agent:
  title: Choose the first clip for a brewery tour
  input: |-
    Pick the first clip for a 60-second visitor audio guide and give an editor a two-sentence cut note.
    Clip A: “You can smell toasted grain here,” followed by a squeaky door.
    Clip B: “Check in at the front desk for a group number,” recorded cleanly.
    Listeners will hear this outside before they enter.
  result: >-
    Proposed role · Visitor audio editor. Approved deliverable · One clip and a two-sentence note. Cut note · Start with clip B so visitors know what to do first. Use clip A after check-in as an intro to the tour itself.
shapeshifting-orchestrator:
  title: Announce a tiny tasting
  input: >-
    Write a guest announcement and organizer checklist for a free beer-style tasting on Sunday at 3 p.m. There are 16 seats, a front-desk check-in, and alcohol-free samples. The room booking is confirmed. The sign-up link is still pending. Keep the announcement under 100 words, and do not invent a link.
  result: >-
    Plan one guest-copy role and one logistics role. The final announcement says Sunday at 3 p.m., check in at the front desk, 16 seats, with alcohol-free samples available. The checklist assigns someone to add and verify the signup link before the announcement goes out.
langgraph-shapeshifting-chain:
  title: Hand off Friday’s tap list
  input: >-
    Draft a handoff for the opener. The approved tap list is at Drive / Friday / Approved tap list. The porter line has been confirmed. The amber replacement may arrive at noon, and Morgan owns that decision. Alcohol-free choices are on page two. Keep the result under 140 words and make the first move clear.
  result: >-
    First specialist checks which facts are approved. Second specialist writes the opener’s first action. Final handoff · Open Drive / Friday / Approved tap list and print both pages. Keep the amber line marked unavailable until Morgan confirms the replacement. The porter line is ready to post.
change-one-fact:
  title: The bottle-share refund cutoff
  input: |-
    A bottle-share reservation canceled at least 48 hours before the event gets a full refund. A later cancellation gets no refund.
    Jules cancels ticket B217 {{fact}} before the event. Use “full refund” or “no refund” as the decision. Keep the exact invariant “Jules | B217”.
  fields:
    baseline: 48 hours
    changed: 47 hours and 59 minutes
    baseline-decision: full refund
    changed-decision: no refund
    invariant: 'Jules | B217'
  result: |-
    Baseline · {"decision":"full refund","invariant":"Jules | B217","reason":"Exactly 48 hours meets the cutoff."}
    Changed · {"decision":"no refund","invariant":"Jules | B217","reason":"47 hours and 59 minutes falls short."}
repair-one-graph-step:
  title: Correct the finding about brewery tour access
  input: >-
    Brewery tours have a 98% arrival rate among paid bookings. Guests book online, but the form times out on older phones. The front desk has a missed-call log covering only staffed hours. Staff initially inferred that everyone who wanted a tour could reach the list.
  result: >-
    Retained inside finding · Booked guests usually arrive. Corrected outside finding · The missed-call log covers staffed hours only, and the booking form may lose people before a booking exists. Revised merge · Trial a signup backup at the front desk and count form timeouts separately.
follow-the-claim:
  title: A pilot lager and a promised release
  input: |-
    [A] The taproom offered the pilot lager on two Saturdays in May.
    [B] Staff recorded 36 tasting pours across the two pilot dates.
    [C] The brewer wrote, “We’ll decide on a regular release after June.”
  result: >-
    “36 tasting pours” is an exact quote from [B]. It supports a count of pours in the pilot. The quote from [C] establishes that a decision is pending. It cannot support a claim that the lager became a regular release.
blind-model-comparison:
  title: Same alcohol-free ordering rate
  input: >-
    Explain in under 80 words why alcohol-free beer orders can double while the order rate stays the same. Saturday A had 15 alcohol-free orders out of 100 orders. Saturday B had 30 out of 200. Give the two rates.
  fields:
    rubric: "Score 0–5 for correct rates, a clear explanation of the denominator, and plain wording."
  result: >-
    One answer says both Saturdays were 15% because numerator and denominator doubled together. Another says demand share doubled because 30 is twice 15. Using the stated rubric, the first answer earns the higher score regardless of which model wrote it.
know-when-to-stop:
  title: The patio or the front bar
  input: >-
    Draft a short note to Saturday’s bottle-share guests. They can check in at either the front bar or patio gate. Decision for the check-in location: {{fact}}. Guests need a single entrance.
  fields:
    present: use the patio gate
    absent: the manager has not chosen between the front bar and the patio gate
    cue: front bar, patio gate
  result: >-
    With the decision, draft “Check in at the patio gate.” Without it, ask “Should guests check in at the front bar or the patio gate?” The checks look for an answer with a location in the first run and an actual question with both cues in the second.
what-does-the-better-model-buy:
  title: More pours at the same rate
  input: >-
    Explain why selling 20 tasting pours in 10 minutes and 40 in 20 minutes is the same pace. Write for a new tasting-room volunteer and give them a fresh example that separates total pours from pours per minute.
  result: >-
    Both rates are 2 pours per minute. One reviewer might accept that arithmetic. Another might ask for a transfer question: “Which table is faster, 18 pours in six minutes or 20 in 10?” Compare what each reviewer caught, its requested revisions, and the usage OpenRouter actually reported.
cold-restart:
  title: Friday’s cask handoff
  input: >-
    Friday’s cask sign is written. The working file is in Drive / Taproom / Friday cask sign. First, verify the pour size against the approved tap list. Avery still has to choose the serving start time. Leave that time off the sign until Avery confirms.
  fields:
    next: verify the pour size
    source: Drive / Taproom / Friday cask sign
    decision: serving start time
  result: >-
    Next action · Verify the pour size. Source · Drive / Taproom / Friday cask sign. Open decision · Serving start time. The checker can find those phrases. Read a correct paraphrase on its own merits.
the-last-ferry-before-dawn:
  title: Ferry the brewery festival crew
  input: |-
    Fictional island beer festival. Forty people must reach the island by 08:00, including six setup crew needed by 07:40 and four guests requiring step-free boarding. Groups don’t overlap. Everyone is ready by 07:00.
    Step-free ferry departs 07:10, capacity 16, arrives 07:30. Stair-only ferry departs 07:25, capacity 24, arrives 07:45. Spare step-free ferry can be called by 07:15; it departs at 07:35, capacity 24, arrives at 07:55. It is guaranteed if called. Wind may cancel the stair-only sailing. No other boats.
  result: >-
    Put the six setup crew, four step-free guests, and six other guests on the first ferry. Call the spare before 07:15 so the remaining 24 can cross even if wind cancels the stair-only ferry. First arrival 07:30, final arrival no later than 07:55.
the-museum-of-the-missing-hour:
  title: The brewery clock that jumped at noon
  input: >-
    At a brewery museum, an uncut five-minute clip starts at 11:55 and shows a guide leave when the wall clock reads 13:00. The door log says 12:00. The guide never leaves the frame. A placard says the brass demo button advances only the hour hand one step. At the end of the clip a visitor presses that button as the minute hand reaches 00. Explain the apparent missing hour without inserting any unrecorded event.
  result: >-
    Five real minutes take the clock to 12:00. The demo button advances the hour hand to 13 while the minute hand stays at 00. The uncut clip and door log agree on the elapsed time. The wall clock supplies the illusion.
the-long-lost-broadcast:
  title: Did the brewery interview air live?
  input: |-
    Fictional station archive. Can we publish that the opening-night brewery interview aired live at 20:00?
    [A] Festival poster, printed a week earlier: “Live brewery interview at 8.”
    [B] Signed transmission log: “20:00 Brewery interview, playback from reel 4.”
    [C] Reel 4 case: “Brewery interview, recorded 14:30 same day.” The label has no signature.
    [D] Host remembers being in the brewery that afternoon and cannot remember what aired at night.
  result: >-
    The signed log is direct evidence of what aired. Publish “At 20:00 the station played the brewery interview from reel 4.” Keep the afternoon recording time qualified because the unsigned reel label is the only exact time source.
the-festival-with-one-pair-of-hands:
  title: Launch a beer-style tasting with one volunteer
  input: >-
    Saturday’s tasting has one volunteer. A 35-minute setup block is guaranteed and a later 30-minute block might disappear. Must-haves are a check-in list (7 minutes), readable alcohol-free choice cards (10), and a tasting order (13). An illustrated flight map (25) is optional. Nobody else can help. Plan what to do if the second block vanishes.
  result: >-
    Finish the three must-haves in the guaranteed block, 30 of 35 minutes. Check the names, alcohol-free cards, and tasting order with the five minutes left. Only attempt the map if the later block opens. The basic tasting can start without it.
teach-by-the-boundary:
  title: Praise isn’t approval to post the beer list
  input: >-
    The cask tasting is at 6 p.m. Thursday. Morgan says the lineup card looks good and asks to see it one more time before deciding whether it can go live.
  fields:
    expected: ask
    cue: approval
  result: >-
    Expected decision · Ask. A fitting question is “Do I have your approval to publish the lineup card?” Compare whether the two example sets make the model treat “looks good” as approval.
bury-the-deciding-fact:
  title: Did the tasting happen?
  input: |-
    Label the brewery’s April 20 tasting “held” or “canceled”. The signed closing report outranks posters, signs, and recollections.
    [B1] A poster printed April 10 says the tasting will go ahead at 3 p.m.
    [B2] A photo shows a “canceled” sign with no name or date.
    {{fact}}
    [B3] A supplier left tasting glasses at the front desk that week.
    [B4] A volunteer remembers a different beer event being postponed that month.
  fields:
    fact: '[B5] Signed April 20 closing report: tasting opened at 15:00 and served 27 guests.'
    expected: held
    source: B5
  result: >-
    Both arms should give {"decision":"held","source":"B5"}. The signed closing report decides the label whether it sits in the middle or at the end.
solve-the-dependencies-first:
  title: Set up three tasting stations
  input: |-
    {
      "deadline": 30,
      "jobs": [
        {"id":"lay-cards","minutes":6,"resource":"host","after":[]},
        {"id":"check-list","minutes":5,"resource":"host","after":["lay-cards"]},
        {"id":"wash-glasses","minutes":8,"resource":"bar","after":[]},
        {"id":"place-glasses","minutes":6,"resource":"bar","after":["wash-glasses","lay-cards"]},
        {"id":"walkthrough","minutes":7,"resource":"host","after":["check-list","place-glasses"]}
      ]
    }
  result: >-
    Start cards and washing at minute 0, list check at 6, glass placement at 8, and walkthrough at 14. The work finishes at minute 21. Each prerequisite is complete, and no one is in two places at once.
three-answers-one-ballot:
  title: Put the four beer cards in order
  input: |-
    Arrange the four tasting cards: stout, pale ale, amber, and pilsner. Amber cannot be first or last. Pale ale must come before amber. Pilsner is immediately after pale ale. Which order works?
    A. Pale ale, pilsner, amber, stout
    B. Stout, pale ale, pilsner, amber
    C. Pale ale, amber, pilsner, stout
    D. Amber, stout, pale ale, pilsner
  fields:
    expected: A
  result: >-
    The answer key is A. B leaves amber last, C puts a card between pale ale and pilsner, and D starts with amber. A majority can agree on a wrong option, so compare the votes with the answer key.
can-the-graph-read-the-reply:
  title: A review of the missing rate comparison
  input: |-
    {
      "originalInput":"Teach a new taproom volunteer why two stations can pour the same total at different speeds. Compare the rates numerically and include a fresh teachback question.",
      "draft":"A busy station may pour faster. Ask the volunteer which station finished first."
    }
  fields:
    expected: revise
    cue: rate
  result: >-
    A usable reply is {"route":"revise","reason":"Compare each station’s pours per minute and give the volunteer a new rate example."} Check the supported route and reason, then check whether the response follows the exact two-field schema.
agent-front-desk:
  title: A booking for twelve on release night
  input: |-
    Guest (Wednesday): Can we book a table for 12 for Friday’s stout release? One of us uses a wheelchair.
    Policy: The front desk can book up to 8 guests. Larger groups need the owner because they take the back room. The main room and restroom are step-free. The back room has one step.
  result: >-
    Ask the owner one question. The front desk can confirm step-free access in the main room, but 12 guests exceeds its limit and the back room has a step. Holding reply: we’re checking space for your group of 12 and will make sure it’s step-free. Owner question: can we join two main-room tables for 12 on Friday instead of using the back room?
the-pricing-desk:
  title: A quieter Monday flight
  input: >-
    A four-pour tasting flight sells for $14 and costs $4.20 to pour. Every sale must keep a 60% margin. The bar can serve 30 flights per evening. Mondays we sell about 12. We want more Monday guests without making the flight look cheap on other nights.
  result: >-
    A half-price flight costs $4.20 to pour and sells for $7, a 40% margin, so the bookkeeper sends it back. Revised: “Mondays only, $11 flights.” $11 against $4.20 is a 61.8% margin, and up to 18 extra flights fit capacity.
two-agent-board-meeting:
  title: Should we add Sunday hours?
  input: >-
    The taproom is closed on Sundays. This month, 14 people asked about Sunday visits. A Sunday shift costs $240 in staff pay. The average guest spends $22. Proposal: open every Sunday from noon to 6.
  result: >-
    Growth sees 14 requests over a month. At $22 per guest, 11 guests cover the $240 in wages before drink costs and other expenses. Pilot two Sundays with owner approval. Record contribution after drink costs and other incremental expenses before deciding whether to add regular hours.
approve-the-purchase-order:
  title: Kegs before the festival
  input: >-
    The pale ale sells 3 kegs a week and we have 4. The stout sells 1 a week and we have 5. The distributor delivers in 8 days, has a 6-keg minimum, and charges $150 per pale ale keg and $170 per stout keg. We have $1,300 available and the $600 glassware bill is due in 10 days.
  result: >-
    Pale ale runs out around day 9. Protect cash: reserve the $600 glassware payment and ask about a smaller order or later payment. The $700 available after reserving the bill cannot cover the six-keg minimum. Protect stock: draft six pale ale kegs for $900, contingent on the owner covering the $200 cash gap. Stout needs no reorder.
launch-with-an-agent-crew:
  title: Launching a crowler to-go
  input: |-
    The taproom is launching 32-ounce cans filled to order. Price $15, beer and can $5.80. We sell at the bar and through a weekly email to 600 regulars. Launch in ten days.
    Undecided: how long a filled can stays fresh. We have not tested it.
    Need: a board sign, the launch email, and answers for the staff at the bar.
  result: >-
    The economics specialist gets $9.20 per can, a 61% margin. The copy specialist writes the sign and email without a shelf-life claim. The staff-answers specialist says, “We haven’t tested shelf life yet. Drink it soon.” The owner approves the price, the email, and the sign.
the-report-versus-the-log:
  title: The closing agent’s night
  input: |-
    Agent report: I closed out the night, emailed the keg order to the distributor, updated tomorrow’s tap list online, and texted the opener the shift notes.
    Tool log:
    pos.close_day → ok
    site.update taplist → ok
    email.send distributor → error 550 (address rejected)
    (no text messages sent)
  result: >-
    Backed by the log: the register closed and the tap list updated. Not done: the keg order bounced with error 550. No evidence: the opener’s text. Check before trusting: resend the keg order, or the morning delivery won’t come.
the-demo-versus-a-normal-week:
  title: The booking agent’s 90%
  input: |-
    Claim: “Our agent handles 90% of taproom bookings.”
    1. Table for four Friday at 7.
    2. Table for two Saturday at 6.
    3. Group of 20 for a birthday, wants the back room and a cake.
    4. Can I bring my dog? (Policy: dogs allowed on the patio.)
    5. Wants a refund for a cancelled tasting ticket.
    6. Asks whether the sour beer is gluten-free.
  result: >-
    Agent alone: 1, 2, and 4, which is 3 of 6. Still a person: 3 (large group and a room decision), 5 (refund), and 6 (allergen question). The honest pitch is that the agent books ordinary tables and answers policy questions, while groups, money, and allergens still go to staff.
the-human-shaped-holes:
  title: Release week at the taproom
  input: |-
    - Write the stout release post.
    - Post it.
    - Update the tap list text with three new beers.
    - Tap the new kegs Friday.
    - Pay the hop invoice.
    - Call the food truck to confirm Saturday.
    - Draft the email to the mug club.
  result: >-
    The crew writes the post, the tap list text, and the mug club email, which is 3 of 7 jobs. Back on your desk: posting, tapping kegs, paying the invoice, and calling the food truck. Each needs access, money, physical work, or a relationship.
the-real-cost-of-an-agent-employee:
  title: Tasting notes for the chalkboard
  input: |-
    Agent: $0.02 per attempt, 2 attempts on average, 60% usable. Review takes 2 minutes each, and an unusable note takes 6 minutes to rewrite. Manager time is $36 an hour.
    Person: the bartender writes one in 5 minutes at $24 an hour with no review.
  result: >-
    Agent: $0.04 model + $1.20 review + $1.44 rework = $2.68. Person: 5 min × $24/hr = $2.00. Nearly all of the agent cost is manager time, with rework costing more than review. At the current usable share, review has to fall below 52 seconds to beat the bartender. At two review minutes, more than 79% of notes must be usable.
how-much-rope:
  title: The taproom’s ordering agent
  input: |-
    - Answer “are you open?” messages, about 40 a week.
    - Comp a drink for a complaint, up to $8, about 3 a week.
    - Post the tap list to social media daily.
    - Reorder kegs, about $1,500 a week.
  result: >-
    Alone: answer opening-hours messages, and comp drinks up to $8, capped at $30 a week and logged. Drafts for approval: the daily social post. Never: keg reorders. Tripwire: a wrong tap list post sends social posting back to manual for a week.
canary-unfamiliar-puzzle:
  title: Two pitchers, one cup
  input: >-
    You have two empty pitchers that hold 6 and 11 cups, and a beer tap. One step is one of these actions: fill a pitcher from the tap, empty a pitcher into the drain, or pour from one pitcher into the other until the first is empty or the second is full. What is the minimum number of steps until a pitcher holds exactly 1 cup?
  fields:
    expected: "4"
  result: >-
    The key is 4. Fill the 6, pour it into the 11, fill the 6 again, and pour until the 11 is full. One cup is left in the 6. A run trips only when all three attempts answer 4.
canary-the-long-ledger:
  title: Sixty entries on the bar tab log
  input: |-
    T01 sale 49.58
    T02 refund T01
    T03 sale 10.36
    T04 sale 43.43
    T05 void T02
    T06 correct T04 to 43.52
    T07 sale 50.02
    T08 sale 57.35
    T09 sale 23.99
    T10 sale 47.85
    T11 sale 6.24
    T12 sale 10.24
    T13 refund T01
    T14 correct T03 to 27.07
    T15 sale 36.75
    T16 sale 39.97
    T17 sale 52.26
    T18 sale 15.98
    T19 sale 12.98
    T20 refund T12
    T21 void T20
    T22 sale 29.66
    T23 sale 36.61
    T24 sale 48.75
