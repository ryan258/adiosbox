# The catalog's shelves, in display order. Each experiment names its shelf with `shelf:`.
startHere: [competing-explanations, prompt-control-group, the-last-ferry-before-dawn]
shelves:
  - key: future
    title: A glimpse of the future
    blurb: Ten small demos of where everyday AI is heading, all runnable today. Each one labels its guesses and leaves the real decisions with a person.
  - key: explain
    title: Figure out what’s going on
    blurb: Something changed and you’re not sure why. Get rival explanations and a way to tell them apart.
  - key: check
    title: Check before you claim
    blurb: Hold a statement up against its evidence and see what survives.
  - key: plan
    title: Plan it, then poke holes
    blurb: Plans, trade-offs, and schedules, plus the ways they could go sideways.
  - key: handoff
    title: Explain it and hand it off
    blurb: Turn messy notes into next steps, and test whether someone else could pick up where you left off.
  - key: team
    title: Build a little AI team
    blurb: One call proposes the assignment or team. You review the plan before the work starts.
  - key: puzzles
    title: Puzzle boxes
    blurb: Branching puzzles with real constraints. The model tries three paths and keeps the most promising one.
  - key: trial
    title: Put the AI on trial
    blurb: Change one thing about a prompt or a model and see what actually moves.
  - key: business
    title: Run a tiny agent business
    blurb: Agents work the front desk, the books, and the launch plan. Money, hiring, and anything sent to customers still wait for the owner.
  - key: retail
    title: Retail at scale
    blurb: Substitutions, returns, recalls, truck splits, supplier fines, and the policy binder. The agent works from your numbers and your written rules, and anything that touches money, a customer, or a shelf waits for a person.
  - key: painpoints
    title: Retail pain points, solved small
    blurb: Six everyday big-box problems, each raised and then solved as a small proof of concept. Phantom stock, spoiling food, self-checkout flags, the pre-open crunch, curb pileups, and messy seller listings. Every fix shows its arithmetic and leaves the decision to a person.
  - key: reality
    title: Agent companies, reality check
    blurb: The pitch says agents run the company. Check what they actually did, which jobs return to you, what checking costs, and how much autonomy is safe.
  - key: canaries
    title: Canaries in the coal mine
    blurb: Tripwires for claimed AI progress. Each has a computed answer key and trips only when a model gets it right three times in a row. Rerun them when a new model ships.
