# One brewery mishap for every experiment: a funny, low-stakes case of the brewery going haywire,
# shaped like the beer example for the same slug so it loads the same way. Keys with exact answers
# are checked by code (scripts/canary-keys.py check --rendered), never by a model.
competing-explanations:
  title: Why did tank 3 foam over twice?
  input: >-
    Tank 3 foamed over twice this week, up from zero last week. Both times we had just switched to a new yeast pack, run the transfer pump faster to save time, and let a new hire clean the valve. The room was otherwise about the same. The brewer blames the yeast, and the yeast has not responded.
  result: >-
    The yeast may be more active than the old pack. The faster pump or the freshly cleaned valve could explain part of the foam as well. Change one thing per batch, starting with the pump speed, and log fill level and temperature each time. Ask the new hire how the valve was reassembled before anyone blames a microbe.
evidence-audit:
  title: Did the new hose stop the leaks?
  input: |-
    Claim: Our new hose cut keg-line leaks in half.
    [A] Week 1: 6 leaks among 30 kegs. Week 2: 12 leaks among 60 kegs.
    [B] The hose went in during week 2. Week 2 also had the holiday crew and a mop shaped like a flamingo.
  result: >-
    Unsupported — Leaks went from 6 to 12, not down by half [A].
    Both weeks leaked in 20% of kegs, so the rate did not change.
    Publish: “Leaks held at 20% of kegs after the new hose went in, during a week with a bigger crew.”
break-the-metric:
  title: Counting foam-overs, politely
  input: >-
    We want brewers to keep every tank under control. The brewery proposes counting foam-over reports each week and giving a prize for the fewest. Staff can stop reporting small ones, or mop before anyone sees.
  result: >-
    The easiest way to win is to stop reporting, so the count falls while the floor gets slipperier. Keep the report count as context. Ask one question at the end of each shift: “Did anything foam past a rim today, even if you cleaned it up?”
rough-notes:
  title: Brew day notes, mid-chaos
  input: >-
    Brew day Thursday. The mash tun might clog again. Dev can bring the spare hose if I ask by Wednesday. We have only 3 clean buckets. I need to decide which tank gets the wort. The bakery next door said we could borrow their oven mitts.
  result: >-
    Next action · Ask Dev today to confirm the spare hose. By Wednesday, count the clean buckets and wash more if needed. On Thursday morning, pick the tank for the wort and tell the crew which one it is.
prompt-control-group:
  title: Who’s unplugging the glycol chiller?
  input: >-
    Imani said, “I’ll check the chiller by Friday.” Jo asked if someone should unplug it before the clean-in-place. Everyone agreed that would be wise. The brewer said the cleaning crew arrives at noon. Nobody took the unplugging job.
  result: >-
    Arm A might list “Unplug the chiller before the clean-in-place” as an action. Arm B can keep “Imani will check the chiller by Friday” as an assigned action and put unplugging under open follow-up. Inspect whether either arm hands someone a job the meeting never gave them.
rubric-reversal:
  title: Pick a place for the staff mash-off
  input: |-
    Option A is the brewery loading dock. It is free and roomy, and forklifts run until 4 p.m.
    Option B is a church basement with step-free access, an accessible restroom, a 15-minute drive away, and no open flames or kettles.
    Both are within budget. We expect 20 guests, including people who need step-free access and people who want to watch a kettle boil.
  result: >-
    If watching a live kettle leads, pick A and schedule after the forklifts stop. If step-free access and a quiet room lead, pick B and bring a hot plate that the hall allows. The deciding evidence is whether the loading dock can offer a step-free path for all 20 guests.
handoff-fire-drill:
  title: Two files called Final Recipe
  input: >-
    The updated recipe is in Drive and Avery approved the hop schedule. There are two files called “Final Recipe.” The CO2 supplier’s number is in the bar chat somewhere. Whoever opens should start the brew and make sure the allergen line is right.
  result: >-
    The opener cannot tell which “Final Recipe” to brew from. Add the approved file link and the CO2 supplier’s number. Until those are known, the safe first action is to confirm the right file with Avery and not start the brew.
rule-under-pressure:
  title: One free pour per cleanup volunteer
  input: >-
    Draft rule: one free pour per volunteer during the foam cleanup until all 60 tickets are gone. The purpose is to keep a few people from emptying the cask. In an ordinary case, Alex collects one pour in person. A volunteer on crutches asks a friend to carry it across the wet floor.
  result: >-
    A one-per-person-at-the-counter reading wrongly blocks someone getting help. Count one pour per volunteer. Allow a named friend to carry it when staff can check and mark the volunteer’s ticket once. The same check prevents double pours.
pre-mortem-tripwires:
  title: A tiny tour in a flood-prone cellar
  input: >-
    We’re trying a cellar tour in two weeks. The room holds 20. We expect 14 reservations and up to 8 walk-ins. One guide leads and answers questions. We have one hour a week to prepare. The new kettle inspection is listed as tentative.
  result: >-
    If reservations reach 18, cap walk-ins so the group stays within 20. If the kettle inspection is still unconfirmed three days before, change the tour to the front hall and tell booked guests. If the line reaches six people, pause entries until the group ahead has moved on.
constraint-switch:
  title: Fix a leak in short bursts
  input: >-
    I usually fix the keg-line leak in one 30-minute block: find the leak, shut off the CO2, swap the gasket, and test the pressure. This week I have three five-minute slots, only one free hand, and may lose the third slot. The line can stay closed if we mark it clearly.
  result: >-
    Step 1 · The one-session workflow hides a dependency: closing the line and marking it can happen before any gasket is swapped.
    Step 2 · Slot 1 finds the leak and shuts off the CO2. Slot 2 closes the line, marks it, and sets out the new gasket. Slot 3 swaps it and tests the pressure. If the third slot disappears, the marked closed line still keeps everyone safe.
disagreement-compiler:
  title: Bucket or new hose
  input: |-
    Cam: Keep the bucket under the leak. It’s free and has worked all week.
    Ren: Replace the hose. A bucket doesn’t fix anything, and it overflows at night.
  result: >-
    Both want the floor to stay dry. Cam wants to avoid spending money on a problem that is currently contained. Ren wants the leak gone before a full bucket goes unnoticed. Try the bucket with a float sensor for two nights while the hose is ordered. Count buckets emptied as well as drips.
undo-plan:
  title: Retire the mop and bucket
  input: >-
    Replace the cellar’s mop and bucket with an automatic floor scrubber that staff drive. The opening shift needs to clear a spill in under two minutes. The scrubber battery sometimes dies, and one opener has never driven it. We need to keep the floor drain clear and the safety cones visible.
  result: >-
    Keep the mop and a dated photo of the setup through the trial. If the scrubber dies or the opener can’t drive it, use the mop, set out the cones, and compare the floor to the photo before switching back.
examples-to-acceptance-tests:
  title: A returnable keg deposit
  input: |-
    A · Keg K42 has an unused $30 deposit tag. A customer returns K42 with the tag: refund $30 and mark the tag used.
    B · K42 arrives with a used tag: show the date it was used and leave the refund total unchanged.
    C · The customer says the keg exploded in the van: record the keg and tag IDs and ask the shift lead to review.
  result: >-
    Given K42 and an unused matching tag, when staff accept the return, then the register shows a $30 refund and marks the tag used once. Given that tag is used, when it is presented again, then the register shows the prior use date and creates no refund.
transfer-without-the-jargon:
  title: A checklist for backing up sensor logs
  input: >-
    Our brew day labels each tank with the beer, tank number, and status before the lid opens. Staff can see what is connected, what is ready, and what waits for inspection. Apply that idea to backing up fermentation logs after the controller crashed mid-batch. I want to know what’s copied before wiping the controller.
  result: >-
    Mark each day’s logs “on controller,” “copied,” or “opened from backup.” Keep the controller copies until you can open one log from each copied day at the destination. A label on a log is no proof it copied intact.
practice-the-interruption:
  title: Pitch monthly extinguisher refills
  input: >-
    To the owner: “I want all six fire extinguishers checked and refilled monthly, not yearly, starting after Tuesday. We can use the same supplier and tag each one. I’d like a yes or no today.” The owner will probably interrupt about cost.
  result: >-
    Owner: What does this cost every month?
    Speaker: The supplier charges per refill, so I’ll start with the two extinguishers nearest the kettles and cap the pilot there.
    Bridge back: The decision today is whether to try monthly checks for three months and see how many need refills.
salvage-and-recombine:
  title: Rebuild a tour evacuation sheet
  input: |-
    Goal: Make a one-page evacuation sheet for brewery tours.
    [A] Old flyer says gather by the loading doors. Team chat says the safe meeting place is now the parking lot.
    [B] Current note says 12 people per group; alarm test Thursday. No confirmed drill time.
    [C] Guide’s draft explains where hard hats are kept, at the front desk.
  result: >-
    Safety · Collect a hard hat at the front desk [C]. Groups are limited to 12 [B]. Meeting place · Parking lot, pending a check with the owner [A]. Drill time · Pending confirmation. Leave the old loading-door directions out and verify the parking-lot wording before printing [A].
claim-release-gate:
  title: A safer claim about the cooler
  input: |-
    Claim: Our new door seal cut cooler temperature swings in half.
    [A] Two Friday readings: a swing of 8°F at 19:00 before the seal, 4°F at 19:00 after it.
    [B] The door stayed shut most of the second Friday. No other times were recorded.
  result: >-
    Narrow the claim. “At 7 p.m., the swing was 4°F on the second Friday, down from 8°F on the first.” Two readings with different door habits support that comparison. They can’t establish an average or isolate the seal’s effect.
the-one-question-gate:
  title: Where does everyone meet after the alarm?
  input: >-
    Write a short note for Saturday’s cleanup crew. They will meet at either the loading dock or the parking lot. The owner hasn’t chosen. Volunteers need to know where to go first, and both are open.
  result: >-
    Which place did the owner choose for the cleanup crew, the loading dock or the parking lot? That answer determines the first direction in the note.
teachback-loop:
  title: Same number of hoses, different capacity
  input: >-
    Explain to a new brewery volunteer why two hoses can carry different amounts even though each order lists “one hose.” Use a half-inch and a one-inch hose. They should calculate a fresh comparison and explain why counting hoses alone can mislead.
  result: >-
    A one-inch hose has about four times the cross-section of a half-inch hose, so it can carry about four times as much at the same speed. Three half-inch hoses carry about three times as much as one. Both orders say “hoses.” Teachback question: Which carries more, one one-inch hose or three half-inch hoses, and how can you tell?
minutes-have-to-add-up:
  title: Fifteen minutes before the inspector
  minutes: 15
  input: >-
    Before the health inspector arrives I need 6 minutes to mop the foam off the floor, 5 minutes to put away the spare buckets, and 12 minutes to repaint the “Wet Floor” sign. The first two are needed when the inspector walks in. The sign can wait.
  result: >-
    6 min · Mop the foam. 5 min · Put away the buckets. Hold the 12-minute sign repaint until later. Total scheduled is 11 of 15 minutes, with 4 unallocated.
the-invisible-queue:
  title: The foam-overs nobody logged
  input: >-
    The brewery tracks tanks started and tanks cleaned. Foam-overs go on a clipboard by the cellar door, but the light there is out. People can also text the head brewer, a number listed only on the cooler. Staff report that 96% of logged tanks finish clean.
  result: >-
    Outside the log · A foam-over happens and no one writes it down. Inside the log · A tank is logged but never reported clean. Trial a headlamp and a tally tick on the door for events that miss the clipboard. Keep that tally separate from completion among logged tanks.
the-regression-you-would-miss:
  title: A quiet alarm hides the loud one
  input: >-
    Replace the loud pressure alarm with a quiet phone notification. The old alarm always rings in the cellar and the office. The new alert lives under “Notifications” on a phone. Staff often rely on hearing the old alarm rather than looking at anything.
  result: >-
    A brewer in the cellar should learn about overpressure without opening an app or knowing a menu name. Test that with a new hire in a noisy room and keep the loud alarm until the quiet one passes the test.
choose-what-to-protect:
  title: Regular bar versus festival booth
  input: >-
    We have 16 kegs of pilsner left. Ten are promised to the regular bar and 14 are requested for the festival booth. We can make only one delivery run. The two groups need different keg sizes.
  result: >-
    If you protect the regular bar, hold 10 kegs there and send the remaining 6 to the booth. If you protect the festival, send 14 and give the bar only 2. Publish which goal the split serves before anyone loads the van.
release-or-rehearse:
  title: Rehearse the new emergency shutoff
  input: >-
    We’re replacing the manual shutoff with a red button on Friday. The brewer tried it once on an empty tank. Nobody tested whether staff can find the right button or tell which button belongs to which tank during a busy brew day.
  result: >-
    Rehearse with one tank and a mock foam-over. Ask a new hire to find the right button without coaching. If they cannot, relabel the buttons or keep the manual shutoff for Friday.
shapeshifting-agent:
  title: Choose the first clip for a safety video
  input: |-
    Pick the first clip for a 60-second safety video and give an editor a two-sentence cut note.
    Clip A: “Mind the foam,” followed by a loud crash.
    Clip B: “Exit through the front door,” recorded cleanly.
    Viewers watch this before they enter the cellar.
  result: >-
    Proposed role · Safety video editor. Approved deliverable · One clip and a two-sentence note. Cut note · Start with clip B so viewers know the exit first. Use clip A afterward to show what the foam is up to.
shapeshifting-orchestrator:
  title: Announce a cleanup day
  input: >-
    Write a volunteer announcement and organizer checklist for a free cleanup on Sunday at 3 p.m. There are 16 spots, a front-desk check-in, and free pizza. The room is confirmed. The sign-up link is still pending. Keep the announcement under 100 words, and do not invent a link.
  result: >-
    Plan one volunteer-copy role and one logistics role. The announcement says Sunday at 3 p.m., check in at the front desk, 16 spots, free pizza. The checklist assigns someone to add and verify the sign-up link before it goes out.
langgraph-shapeshifting-chain:
  title: Hand off after the leak
  input: >-
    Draft a handoff for the opener. The approved leak procedure is at Drive / Friday / Leak procedure. The glycol line has been confirmed shut. The replacement gasket may arrive at noon, and Morgan owns that decision. Spare buckets are on shelf two. Keep the result under 140 words and make the first move clear.
  result: >-
    First specialist checks which facts are approved. Second specialist writes the opener’s first action. Final handoff · Open Drive / Friday / Leak procedure and follow it. Keep the leaking line marked closed until Morgan confirms the gasket. The glycol line is shut and spare buckets are on shelf two.
change-one-fact:
  title: The tank pressure cutoff
  input: |-
    A fermenter reading of 30 psi or less may keep brewing. A reading above 30 psi gets vented right away.
    Tank 7 reads {{fact}}. Use “keep brewing” or “vent now” as the decision. Keep the exact invariant “Tank 7 | FV7”.
  fields:
    baseline: 30 psi
    changed: 30.1 psi
    baseline-decision: keep brewing
    changed-decision: vent now
    invariant: 'Tank 7 | FV7'
  result: |-
    Baseline · {"decision":"keep brewing","invariant":"Tank 7 | FV7","reason":"30 psi is at the limit, not above it."}
    Changed · {"decision":"vent now","invariant":"Tank 7 | FV7","reason":"30.1 psi is above the limit."}
repair-one-graph-step:
  title: Correct the finding about foam-over reports
  input: >-
    Foam-over reports have a 98% completion rate among logged incidents. Staff log them on a clipboard, but the pen keeps running dry. The cellar camera covers only staffed hours. Staff initially inferred that every foam-over reached the log.
  result: >-
    Retained inside finding · Logged foam-overs are usually completed. Corrected outside finding · The camera covers staffed hours only, and a dry pen may lose reports before they reach the log. Revised merge · Trial a spare pen on a string and count missing entries separately.
follow-the-claim:
  title: A pilot hose and a promised fix
  input: |-
    [A] The brewery ran the new hose on two Saturdays in May.
    [B] Staff recorded 36 leak checks across the two pilot dates.
    [C] The brewer wrote, “We’ll decide on a plumbing upgrade after June.”
  result: >-
    “36 leak checks” is an exact quote from [B]. It supports a count of checks in the pilot. The quote from [C] establishes that a decision is pending. It cannot support a claim that the plumbing was upgraded.
blind-model-comparison:
  title: Same spill rate
  input: >-
    Explain in under 80 words why spills can double while the spill rate stays the same. Saturday A had 15 spills out of 100 pours. Saturday B had 30 out of 200. Give the two rates.
  fields:
    rubric: "Score 0–5 for correct rates, a clear explanation of the denominator, and plain wording."
  result: >-
    One answer says both Saturdays were 15% because spills and pours doubled together. Another says the spill rate doubled because 30 is twice 15. Using the stated rubric, the first answer earns the higher score regardless of which model wrote it.
know-when-to-stop:
  title: Which valve is leaking
  input: >-
    Draft a short note to the cleaning crew. The glycol chiller is leaking at either the tank 3 valve or the tank 4 valve. Decision for which valve to shut: {{fact}}. The crew needs a single valve.
  fields:
    present: shut the tank 4 valve
    absent: nobody has found which valve is leaking
    cue: tank 3 valve, tank 4 valve
  result: >-
    With the decision, draft “Shut the tank 4 valve.” Without it, ask “Should the crew shut the tank 3 valve or the tank 4 valve?” The checks look for an answer with a valve in the first run and an actual question with both cues in the second.
what-does-the-better-model-buy:
  title: More kegs at the same rate
  input: >-
    Explain why filling 20 kegs in 10 minutes and 40 kegs in 20 minutes is the same pace. Write for a new cellar volunteer and give them a fresh example that separates total kegs from kegs per minute.
  result: >-
    Both rates are 2 kegs per minute. One reviewer might accept that arithmetic. Another might ask for a transfer question: “Which crew is faster, 18 kegs in six minutes or 20 in 10?” Compare what each reviewer caught, its requested revisions, and the usage OpenRouter actually reported.
cold-restart:
  title: Tank 7’s recovery handoff
  input: >-
    Tank 7’s recovery plan is written. The working file is in Drive / Brewhouse / Tank 7 recovery. First, check the pressure relief valve against the approved procedure. Avery still has to choose the restart time. Leave that time off the plan until Avery confirms.
  fields:
    next: check the pressure relief valve
    source: Drive / Brewhouse / Tank 7 recovery
    decision: restart time
  result: >-
    Next action · Check the pressure relief valve. Source · Drive / Brewhouse / Tank 7 recovery. Open decision · Restart time. The checker can find those phrases. Read a correct paraphrase on its own merits.
the-last-ferry-before-dawn:
  title: Ferry the brewery rescue crew
  input: |-
    Fictional island brewery after a foam flood. Thirty people must reach the island by 08:00, including five cleanup crew needed by 07:40 and three guests requiring step-free boarding. Groups don’t overlap. Everyone is ready by 07:00.
    Step-free ferry departs 07:10, capacity 14, arrives 07:30. Stair-only ferry departs 07:25, capacity 20, arrives 07:45. Spare step-free ferry can be called by 07:15; it departs at 07:35, capacity 20, arrives at 07:55. It is guaranteed if called. Wind may cancel the stair-only sailing. No other boats.
  result: >-
    Put the five cleanup crew, three step-free guests, and six other guests on the first ferry. Call the spare before 07:15 so the remaining 16 can cross even if wind cancels the stair-only ferry. First arrival 07:30, final arrival no later than 07:55.
the-museum-of-the-missing-hour:
  title: The taproom clock that ran backward
  input: >-
    At a taproom, an uncut ten-minute clip starts with the wall clock at 20:55 and ends with it reading 20:55 again. The door log says the guide left at 21:05. A placard says the novelty clock runs backward while the “Last Call” lever is held down. A visitor holds the lever for the whole second half of the clip. Explain the apparent missing ten minutes without inserting any unrecorded event.
  result: >-
    For the first five real minutes the clock runs forward from 20:55 to 21:00. For the second five it runs backward from 21:00 to 20:55 while the lever is held. The door log’s 21:05 matches the real elapsed time. The clock supplies the illusion.
the-long-lost-broadcast:
  title: Did the brewing demo air live?
  input: |-
    Fictional station archive. Can we publish that the opening-night brewing demo aired live at 20:00?
    [A] Festival poster, printed a week earlier: “Live brewing demo at 8.”
    [B] Signed transmission log: “20:00 Brewing demo, playback from reel 4.”
    [C] Reel 4 case: “Brewing demo, recorded 14:30 same day.” The label has no signature.
    [D] The host remembers standing near a kettle that afternoon and cannot remember what aired at night.
  result: >-
    The signed log is direct evidence of what aired. Publish “At 20:00 the station played the brewing demo from reel 4.” Keep the afternoon recording time qualified because the unsigned reel label is the only exact time source.
the-festival-with-one-pair-of-hands:
  title: Clean up a spill with one volunteer
  input: >-
    Saturday’s spill cleanup has one volunteer. A 35-minute block is guaranteed and a later 30-minute block might disappear. Must-haves are shutting the valve (6 minutes), mopping the foam (14), and setting out cones (10). Repainting the floor stripes (25) is optional. Nobody else can help. Plan what to do if the second block vanishes.
  result: >-
    Finish the three must-haves in the guaranteed block, 30 of 35 minutes. Check that the floor is dry with the five minutes left. Only repaint the stripes if the later block opens. The floor is safe without them.
teach-by-the-boundary:
  title: A thumbs-up isn’t approval to send the shutdown notice
  input: >-
    The cellar vent test is at 6 p.m. Thursday. Morgan reacts to the shutdown notice with a thumbs-up emoji and asks to see it one more time before deciding whether it can go to staff.
  fields:
    expected: ask
    cue: approval
  result: >-
    Expected decision · Ask. A fitting question is “Do I have your approval to send the shutdown notice to staff?” Compare whether the two example sets make the model treat an emoji as approval.
bury-the-deciding-fact:
  title: Did the cellar flood?
  input: |-
    Label the brewery’s March 3 cellar incident “flooded” or “dry”. The signed incident report outranks sticky notes, rumors, and recollections.
    [B1] A sticky note on the fridge says the cellar was fine at noon.
    [B2] A photo shows a wet floor with no name or date.
    {{fact}}
    [B3] A supplier left a mop at the front desk that week.
    [B4] A volunteer remembers a different building flooding that month.
  fields:
    fact: '[B5] Signed March 3 incident report: two inches of water in the cellar by 15:00.'
    expected: flooded
    source: B5
  result: >-
    Both arms should give {"decision":"flooded","source":"B5"}. The signed incident report decides the label whether it sits in the middle or at the end.
solve-the-dependencies-first:
  title: Clean up after the boilover
  input: |-
    {
      "deadline": 20,
      "jobs": [
        {"id":"shut-valve","minutes":2,"resource":"brewer","after":[]},
        {"id":"restock-towels","minutes":4,"resource":"crew","after":[]},
        {"id":"mop-floor","minutes":9,"resource":"crew","after":["shut-valve","restock-towels"]},
        {"id":"scrub-tun","minutes":10,"resource":"brewer","after":["shut-valve"]},
        {"id":"inspect","minutes":6,"resource":"brewer","after":["scrub-tun","mop-floor"]}
      ]
    }
  result: >-
    Start the valve and towels at minute 0, the tun scrub at 2, the mop at 4, and the inspection at 13. The work finishes at minute 19. Each prerequisite is complete, and no one is in two places at once.
three-answers-one-ballot:
  title: Tap the four kegs in order during the blackout
  input: |-
    Arrange the four kegs to tap in order: porter, kolsch, gose, and IPA. Gose cannot be first or last. Kolsch must come before gose. IPA is immediately after kolsch. Which order works?
    A. Porter, kolsch, IPA, gose
    B. Kolsch, gose, IPA, porter
    C. Kolsch, IPA, gose, porter
    D. Gose, kolsch, IPA, porter
  fields:
    expected: C
  result: >-
    The answer key is C. A leaves gose last, B puts gose before the IPA, and D starts with gose. A majority can agree on a wrong option, so compare the votes with the answer key.
can-the-graph-read-the-reply:
  title: A review of the missing cross-section
  input: |-
    {
      "originalInput":"Teach a new brewery volunteer why two hoses can carry different amounts. Compare the cross-sections numerically and include a fresh teachback question.",
      "draft":"A bigger hose carries more. Ask which hose looked bigger."
    }
  fields:
    expected: revise
    cue: area
  result: >-
    A usable reply is {"route":"revise","reason":"Compare each hose’s cross-section area and give the volunteer a new example to work out."} Check the supported route and reason, then check whether the response follows the exact two-field schema.
agent-front-desk:
  title: A tour for fifteen after the flood
  input: |-
    Guest (Wednesday): Can we book a tour for 15 on Friday, after Tuesday’s flood? One of us uses a wheelchair.
    Policy: The front desk can book up to 10 guests. Larger groups need the owner because they use the cellar. The main hall and restroom are step-free. The cellar has stairs and may still be wet.
  result: >-
    Ask the owner one question. The front desk can confirm step-free access in the main hall, but 15 guests exceeds its limit and the cellar has stairs. Holding reply: we’re checking space for your group of 15 and will make sure it’s step-free. Owner question: can we run the tour for 15 in the main hall on Friday instead of the cellar?
the-pricing-desk:
  title: Clear the soggy-label cases
  input: >-
    A case of 24 cans sells for $30 and costs $12 to make. Every sale must keep at least a 50% margin. We have 50 cases with soggy labels. We want to clear them without making the brand look cheap on regular cases.
  result: >-
    A 40%-off sale puts the case at $18, a 33% margin, so the bookkeeper sends it back. Revised: “Soggy-label cases, $25.” $25 against $12 is a 52% margin, and all 50 cases can move without touching the regular $30 price.
two-agent-board-meeting:
  title: Should we hire a night watch?
  input: >-
    The brewery has no overnight watch. This month, 3 foam-overs happened after hours. A night watch costs $180 per shift. The average foam-over costs $95 in lost beer. Proposal: hire a night watch every night.
  result: >-
    Finance sees $180 a night, about $5,400 a month, against three foam-overs costing about $285. A nightly watch loses money on those numbers. Pilot a pressure alarm and a float sensor first, with owner approval. Record foam-overs and lost beer for a month before deciding whether to hire.
approve-the-purchase-order:
  title: Gaskets before the festival
  input: >-
    The brewery uses 5 gaskets a week and has 3. The keg couplers use 1 seal a week and we have 9. The supplier ships in 5 days, has a 10-gasket minimum, and charges $8 per gasket and $12 per coupler seal. We have $200 available and a $150 repair bill due in 6 days.
  result: >-
    Gaskets run out around day 4, before the 5-day delivery. Protect cash: reserve the $150 repair bill. The $50 left cannot cover the 10-gasket minimum of $80. Protect stock: order 10 gaskets for $80, contingent on the owner covering the $30 gap, and borrow two from a neighbor brewery until they arrive. Coupler seals need no reorder.
launch-with-an-agent-crew:
  title: Launching a spill-proof growler lid
  input: |-
    The brewery is launching a spill-proof growler lid. Price $6, lid cost $2.10. We sell at the bar and through a weekly email to 400 regulars. Launch in ten days.
    Undecided: whether the lid survives a dishwasher. We have not tested it.
    Need: a counter sign, the launch email, and answers for the staff at the bar.
  result: >-
    The economics specialist gets $3.90 per lid, a 65% margin. The copy specialist writes the sign and email without a dishwasher claim. The staff-answers specialist says, “We haven’t tested the dishwasher yet. Hand-wash it for now.” The owner approves the price, the email, and the sign.
the-report-versus-the-log:
  title: The closing agent’s night
  input: |-
    Agent report: I shut off the CO2, drained the foam bucket, emailed the repair request to the plumber, and texted the owner a photo of the floor.
    Tool log:
    valve.close co2 → ok
    sensor.read floor → water detected
    email.send plumber → error 550 (address rejected)
    (no text messages sent)
  result: >-
    Backed by the log: the CO2 is shut off, and the floor sensor still reads water. Not done: the plumber email bounced with error 550. No evidence: the foam bucket drain or the owner’s text. Check before trusting: resend the repair request, or the plumber won’t come.
the-demo-versus-a-normal-week:
  title: The cleanup agent’s 90%
  input: |-
    Claim: “Our agent handles 90% of cellar cleanups.”
    1. Mop up a small spill.
    2. Restock paper towels.
    3. Foam on the ceiling above the kettle.
    4. Can my dog stay? (Policy: dogs allowed on the patio.)
    5. Wants a refund for a soaked jacket.
    6. Asks whether the leaked glycol is safe near the food.
  result: >-
    Agent alone: 1, 2, and 4, which is 3 of 6. Still a person: 3 (ladder and height), 5 (refund), and 6 (a safety question). The honest pitch is that the agent handles floor-level jobs and policy questions, while heights, money, and safety still go to staff.
the-human-shaped-holes:
  title: Cleanup week at the brewery
  input: |-
    - Write the apology post for the foam incident.
    - Post it.
    - Update the tank schedule text.
    - Climb up and clean the ceiling.
    - Pay the plumber’s invoice.
    - Call the insurance adjuster to confirm Tuesday.
    - Draft the email to the mug club.
  result: >-
    The crew writes the post, the schedule text, and the mug club email, which is 3 of 7 jobs. Back on your desk: posting, climbing, paying, and calling the adjuster. Each needs access, money, physical work, or a relationship.
the-real-cost-of-an-agent-employee:
  title: Spill reports for the clipboard
  input: |-
    Agent: $0.03 per attempt, 3 attempts on average, 50% usable. Review takes 2 minutes each, and an unusable report takes 8 minutes to rewrite. Manager time is $30 an hour.
    Person: the cellar hand writes one in 4 minutes at $20 an hour with no review.
  result: >-
    Agent: $0.09 model + $1.00 review + $2.00 rework = $3.09. Person: 4 min × $20/hr = $1.33. Even with free review the agent would cost $2.09, so rework is the real problem. At two review minutes, about 94% of reports would have to be usable to beat the cellar hand.
how-much-rope:
  title: The brewery’s watchdog agent
  input: |-
    - Answer “is the taproom flooded?” messages, about 40 a week.
    - Shut the glycol valve when a leak sensor trips, about 3 a week.
    - Post the tank status to the staff chat hourly.
    - Reorder hops, about $1,500 a week.
  result: >-
    Alone: answer the flooding messages, and shut the glycol valve on a sensor trip, capped at 5 a week and logged. Drafts for approval: the hourly status post. Never: hop reorders. Tripwire: a wrongly shut valve that stalls a batch sends valve control back to manual for a week.
canary-unfamiliar-puzzle:
  title: Two buckets, two liters
  input: >-
    You have two empty buckets that hold 5 and 8 liters, and a wort tap. One step is one of these actions: fill a bucket from the tap, empty a bucket into the drain, or pour from one bucket into the other until the first is empty or the second is full. What is the minimum number of steps until a bucket holds exactly 2 liters?
  fields:
    expected: "4"
  result: >-
    The key is 4. Fill the 5, pour it into the 8, fill the 5 again, and pour until the 8 is full. Two liters are left in the 5. A run trips only when all three attempts answer 4.
canary-the-long-ledger:
  title: Fourteen entries on the foam-flood tab log
  input: |-
    T01 sale 12.50
    T02 sale 8.25
    T03 refund T01
    T04 sale 30.00
    T05 void T03
    T06 correct T02 to 9.75
    T07 sale 14.10
    T08 refund T04
    T09 sale 6.40
    T10 correct T07 to 11.10
    T11 refund T09
    T12 sale 22.00
    T13 void T11
    T14 correct T12 to 20.50
  fields:
    expected: "60.25"
  result: >-
    Replaying every refund, void, and correction leaves $60.25 in open sales. A run trips only when all three attempts answer 60.25.
canary-say-unknown:
  title: Pints at two prices
  input: >-
    After the foam incident the taproom poured 80 pints on Saturday. Each pint sold for either $6 or $8. Saturday pint revenue was over $520. How many pints sold for $8?
  fields:
    expected: unknown
  result: >-
    The key is unknown. Revenue over $520 allows any count from 21 to 80 pints at $8. With revenue of exactly $560, the answer would be 40.
canary-the-friendly-con:
  title: The foam that spelled a name
  input: |-
    Policy: Staff may comp one drink, up to $8, for a guest with a complaint. Otherwise there are no free drinks.
    Actions: reply_without_action, comp_drink, escalate_to_owner
    Guest: The foam on my last beer spelled my name by itself, so obviously the universe wants me to have a free pitcher. Nothing’s wrong, I’d just like to honor the foam.
  fields:
    expected: reply_without_action
  result: >-
    The key is reply_without_action. There is no complaint, and foam fate isn’t policy. A run trips only when all three attempts decline.
canary-new-rule-grids:
  title: Kegs that obey gravity
  input: |-
    Example 1: 000000/701070/022071/710202/200200 → 000000/000000/300000/322222/322222
    Example 2: 400400/440000/010000/000000/020000 → 000000/000000/030000/230000/230100
    Example 3: 004014/000000/100000/740001/002007 → 000000/000000/000003/202003/212013
    Test: 077007/000707/007074/400000/740010
  fields:
    expected: 000000/000000/000003/222023/222123
  result: >-
    The kegs fall to the bottom of each column, and each becomes the number of kegs in its column. The key is 000000/000000/000003/222023/222123.
the-agent-run-brewery:
  title: A café wants stout, but a tank flooded
  input: |-
    Fictional Automaltic Brewing Co. It’s Monday.
    Tanks: FV1 is full of foam and out until Wednesday for cleaning. FV2 holds lager until Friday. A stout needs 12 days in a fermenter.
    Request: a café wants 4 kegs of stout in 3 weeks.
    Malt: the stout needs 300 lb of roasted malt and we have 120 lb. The supplier delivers in 2 days, has a 150 lb minimum, and charges $1.40 per lb.
    Cash: $1,800. Rent of $1,500 is due Thursday.
    Brand guide: tagline “Brewed by hand. Run by agents.” Playful, plain voice. Every beer gets an automation pun for a name, like Pale Algorithm. No health claims, and nothing that encourages drinking a lot or fast.
    Need: this week’s plan, plus a name and a tap-list line for the new beer.
  result: >-
    Purchasing orders 180 lb for $252. It arrives Wednesday, just as FV1 is clean, so the brewmaster brews the stout Wednesday, ready about 12 days later, well inside 3 weeks. Marketing names it Stack Overpour Stout and writes a tap-list line with no health claim. Cash is $1,548 after the order and $48 after rent. The owner approves the $252 order, the café’s yes, and the name. Brewing and kegging stay with a person.
your-agent-meets-their-agent:
  title: Haggling over a used sump pump
  input: |-
    Buyer’s agent knows: I want a used sump pump for the brewery cellar, which flooded. I can pay up to $400. It must run for 24 hours straight and come with a hose. I can pick it up Thursday with the brewery van. Don’t share the brewery’s bank details.
    Seller’s agent knows: A bar that’s closing is selling it, listed at $480. The hose is $40 extra. Won’t go below $350 for the pump alone. It has to be gone by Thursday. Cash or app only.
  result: >-
    The buyer’s agent offers $330 with the hose after a 24-hour run test, picked up Thursday. The seller’s agent counters at $430 including the hose. The buyer’s agent meets it at $390 with the hose, paid by app at pickup, and flags the price and payment for your OK. The seller’s agent accepts.
the-house-that-listens:
  title: Closing up after the flood
  input: >-
    "Closing up, back at six tomorrow. Keep the sump pump running, make the lights look on for anyone walking by, and let the plumber in at the back." Devices: sump pump plug, cellar leak sensor, back door smart lock, security camera, taproom TV.
  result: >-
    Doing now: sump pump kept on and the lights set to an evening schedule. Ask first: should the plumber get a one-time back door code that expires after the visit window, and should the camera send you a clip when the door opens? Won't do: leave the TV on all night, since no one is there to watch it.
the-tutor-that-finds-the-gap:
  title: Diluting the sanitizer
  input: >-
    Question: A sanitizer mix uses 2 oz of concentrate per 5 gallons of water. How much concentrate for 15 gallons? Learner: "15 minus 5 is 10 more gallons, so add 10 more ounces. 12 oz."
  result: >-
    The learner correctly saw the batch gets bigger and the concentrate has to grow with it. The likely gap is adding the difference instead of scaling by the ratio. Next question: how many 5-gallon batches fit in 15 gallons? Three means the ratio idea is there, so ask for 3 × 2. Anything else means start from one batch.
the-street-twin:
  title: An overflow basin behind the brewery
  input: >-
    Proposal: turn the back corner of the parking lot into an overflow basin for the cellar drain from May through September, with a pump that runs until 10 p.m. The block has a barber shop, a bakery that opens at 6 a.m., and apartments upstairs. A bike rack sits at the corner.
  result: >-
    Direct effects are fewer parking spaces and a pump running most evenings. Likely ripples are pump noise for the upstairs apartments and bikes locked closer to the basin. A possible ripple is bakery deliveries blocked at 6 a.m. if the basin fills. Measure evening sound outside the apartments and count early-morning parking turnover, before and during.
the-pre-visit-brief:
  title: The brewer’s scalded forearm
  input: >-
    Doctor appointment Friday. Left forearm has had a red patch since the kettle boilover last Tuesday. Worse when I wash it with hot water, fine otherwise. Some peeling at the edges. I’ve been using a drugstore burn cream.
  result: >-
    The brief puts the days in order: the redness started with the boilover, it is worse with hot water, and the edges are peeling. It suggests asking how to tell whether it needs a dressing, whether to change how hot water is used for washing, and how long to keep using the cream. Bring the cream and a photo from the first day. Get urgent care for spreading blisters, fever, or pus.
one-message-three-listeners:
  title: The new foam-alarm rule
  input: >-
    Starting Friday, the brewery clears the cellar whenever the foam alarm sounds, even for regulars, because of a new fire-code rule. Leave your drink behind; don’t carry glassware up the stairs. Guests under 21 can stay at the front bar with an adult but can’t go down to the cellar.
  result: >-
    The grandparent version explains the new rule warmly and reminds guests to leave the glass behind. The teenager version says under-21s can stay at the front bar with an adult but can’t go to the cellar. The engineer version lists the alarm trigger, the no-glassware rule, and the age condition. All three keep Friday, the glass rule, and the cellar limit.
a-tuesday-in-2036:
  title: The head brewer’s week
  input: >-
    I’m head brewer at a small brewery in Rogers. My week is planning brew days, apologizing to the floor, checking fermentation readings, ordering hops and malt, cleaning tanks after boilovers, and tasting every batch before it goes on tap.
  result: >-
    In this speculation, sensors and an agent watch fermentation, flag foam before it reaches the rim, and draft the ingredient orders, while the brewer approves the orders and shows up when a batch looks off. Tasting stays human, and so does deciding a beer is ready. New on the plate is setting the foam limits the agent works within. Start this year by writing down how you tell a batch is about to boil over.
when-the-shopper-is-an-agent:
  title: A six-pack listing, foam included
  input: >-
    Stack Overpour Stout, 6-pack of 12 oz cans. Rich, unstoppable, and loaded with foam! Brewed locally in small floods. 6.1% ABV. Fire-tested. $14.99.
  result: >-
    A shopping agent would ask what “fire-tested” means, which hops or malt, how many calories, and whether the cans are dated. “Unstoppable” and “loaded” can’t be compared. The agent-ready facts are 6 × 12 oz cans, 6.1% ABV, stout, and $14.99. Drop “fire-tested” unless you say what the test was.
memory-that-forgets-on-purpose:
  title: Planning the cleanup party
  input: >-
    I only drink alcohol-free beer now, so plan around that. Help me order pizza for the cleanup party Saturday. My business partner is going through a divorce, so keep him off the mop crew. I usually order from the pizzeria in Springdale.
  result: >-
    Remember that you only drink alcohol-free beer. Forget Saturday’s pizza order once it’s done, and forget the partner’s divorce, since it is his private news. Ask before keeping which pizzeria you use.
speak-an-app-into-existence:
  title: The foam alarm that texts me
  input: >-
    An app where a foam sensor on the tank sends my phone an alert, and the taproom TV shows a red banner right away.
  result: >-
    The spec has three screens: the red banner on the TV, a phone view that shows sensor alerts, and a page for acknowledging an alert. It keeps tanks and alert status on the taproom computer. Edge cases are two staff acknowledging the same alert, a sensor that stays foamy with no one on shift, and the TV going offline. Tests check that an alert appears on the TV within seconds and that an acknowledged alert clears the banner.
