name: Publish GitHub Pages staging

on:
  workflow_dispatch:

concurrency:
  group: github-pages-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-adiosbox
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify the staging artifact
        env:
          ADIOSBOX_STAGING_URL: ${{ steps.pages.outputs.base_url }}
          ADIOSBOX_GITHUB_PAGES_OUTPUT: public
        run: |
          test -n "$ADIOSBOX_STAGING_URL"
          npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
