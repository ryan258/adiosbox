name: Publish GitHub Pages staging

on:
  workflow_dispatch:

concurrency:
  group: github-pages-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.168.0'
      HUGO_SHA256: b7cd5087c39bf5584e40180bd04fab0c6fb19f2913cd63121da8663e112a08db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install LangGraph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          package="$RUNNER_TEMP/hugo.deb"
          curl --fail --silent --show-error --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            --output "$package"
          printf '%s  %s\n' "$HUGO_SHA256" "$package" | sha256sum --check
          sudo dpkg -i "$package"
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Build staging site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo --panicOnWarning --environment staging --baseURL "${PAGES_URL%/}/"
          rm -f public/_headers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
